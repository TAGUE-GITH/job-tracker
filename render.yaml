# Blueprint Render : decrit le backend (Infrastructure as Code).
# Render > New > Blueprint > choisir ce depot. La base PostgreSQL est hebergee chez Neon (gratuit),
# le frontend chez Vercel (voir frontend/vercel.json et frontend/.env.vercel).
# A chaque push, Render resynchronise ces variables : une valeur ecrite ici ("value") remplace
# celle saisie dans le tableau de bord, "sync: false" laisse la valeur du tableau de bord intacte.
services:
  - type: web
    name: job-tracker-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    # Deploie seulement quand la CI GitHub Actions est verte
    autoDeployTrigger: checksPass
    envVars:
      - key: DB_URL
        sync: false # ex. jdbc:postgresql://ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: LBA_API_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: JOOBLE_HOST
        sync: false # fr.jooble.org pour une cle demandee sur le site francais
      - key: FT_CLIENT_ID
        sync: false
      - key: FT_CLIENT_SECRET
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      # Emails "mot de passe oublie" (https://www.brevo.com, gratuit) : cle API et adresse d'expediteur verifiee
      # Comptes administrateurs (page Administration) : emails separes par des virgules
      - key: ADMIN_EMAILS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://taguora.vercel.app
      - key: JWT_SECRET
        generateValue: true
      # Adresse du frontend Vercel (fixee ici pour ne plus etre effacee a chaque synchronisation)
      - key: CORS_ORIGINS
        value: https://job-tracker-five-omega-85.vercel.app,https://taguora.vercel.app
