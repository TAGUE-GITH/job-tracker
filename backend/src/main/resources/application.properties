spring.application.name=job-tracker

# Render impose le port via la variable PORT
server.port=${PORT:8080}

# Base de donnees : H2 (fichier local) par defaut, PostgreSQL via les variables d'environnement (docker-compose, Neon)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jobtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
# Le schema est gere par Flyway (db/migration) ; Hibernate verifie seulement qu'il correspond aux entites
spring.jpa.hibernate.ddl-auto=validate
# Base deja existante (creee avant Flyway) : on la prend comme version 1 puis on applique les suivantes
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

# Upload des CV / lettres (stockes en base)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-a-changer-absolument-en-production-0123456789}
app.jwt.expiration-hours=24

# Origines autorisees a appeler l'API depuis un autre domaine (separees par des virgules)
app.cors.origins=${CORS_ORIGINS:}

# IA (API compatible OpenAI : Groq, OpenRouter, Ollama, Gemini...)
app.ia.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ia.api-key=${AI_API_KEY:}
app.ia.model=${AI_MODEL:openai/gpt-oss-120b}

management.endpoints.web.exposure.include=health
# Offres d emploi : La bonne alternance (alternance), Adzuna (tous contrats), France Travail (acces restreint)
app.offres.lba.api-key=${LBA_API_KEY:}
app.offres.france-travail.client-id=${FT_CLIENT_ID:}
app.offres.france-travail.client-secret=${FT_CLIENT_SECRET:}
app.offres.jooble.api-key=${JOOBLE_API_KEY:}
app.offres.jooble.host=${JOOBLE_HOST:jooble.org}
app.offres.adzuna.app-id=${ADZUNA_APP_ID:}
app.offres.adzuna.app-key=${ADZUNA_APP_KEY:}
# Emails (mot de passe oublie) via l'API Brevo ; sans cle, l'email est ecrit dans les logs
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.expediteur=${MAIL_FROM:}
# Adresse du site, pour les liens envoyes par email
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.admin.emails=${ADMIN_EMAILS:}
