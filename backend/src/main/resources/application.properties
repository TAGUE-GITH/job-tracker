spring.application.name=job-tracker

# Base de donnees : H2 (fichier local) par defaut, PostgreSQL via les variables d'environnement (docker-compose)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/jobtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload des CV / lettres
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.dir=${STORAGE_DIR:./uploads}

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-a-changer-absolument-en-production-0123456789}
app.jwt.expiration-hours=24

# IA (API compatible OpenAI : Groq, OpenRouter, Ollama, Gemini...)
app.ia.base-url=${AI_BASE_URL:https://api.groq.com/openai/v1}
app.ia.api-key=${AI_API_KEY:}
app.ia.model=${AI_MODEL:llama-3.3-70b-versatile}

management.endpoints.web.exposure.include=health
